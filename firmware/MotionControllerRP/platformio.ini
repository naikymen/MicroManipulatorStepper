; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; -------------------- README ----------------------------------------------

; ON LINUX UDEV RULES NEED TO BE INSTALLED:
;  sudo curl -fsSL  https://raw.githubusercontent.com/platformio/platformio-core/develop/platformio/assets/system/99-platformio-udev.rules -o /etc/udev/rules.d/99-platformio-udev.rules
;  sudo systemctl restart systemd-udevd
;  replug device, then upload should work

; Also potentially uninstall official plattform with:
;  pio platform uninstall raspberrypi

; --------------------------------------------------------------------------

[platformio]
default_envs = pico

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2   # use this for RP2530
# board = rpipico  # use this for RP2040
board_build.filesystem_size = 0.5m

framework = arduino
upload_port = /dev/serial/by-id/usb-2e8a_Micro-Manipulator_81A5365DC37CD552-if00
monitor_port = /dev/serial/by-id/usb-2e8a_Micro-Manipulator_81A5365DC37CD552-if00
monitor_speed = 921600
monitor_filters = direct
build_flags =
    -include include/usb_strings.h
    -Wl,-u_printf_float

lib_deps =
    littlefs
    mryslab/NeoPixelConnect@^1.4.0

; Normal robot firmware with the tested continuous-field handover and preflight.
; Diagnostic pauses, bounded pulses, and calibration overrides remain off.
[env:pico]
build_flags =
    ${env.build_flags}
    -DHOMING_BUMPLESS_SERVO_RESTART
    -DHOMING_RESTART_GUARD
    -DHOMING_ENCODER_BACKOFF

; Same guards and timing as pico, with labeled before/after backoff phase logs.
; No diagnostic pauses or automatic motion; saved calibration is unchanged.
[env:homing_guard_trace_test]
build_flags =
    ${env:pico.build_flags}
    -DHOMING_PHASE_TRACE

; RAM-only reference comparison at normal homing timing. M56 skips feedback
; restart; G28 retains the normal restart guard. Omit S to keep flash unchanged.
[env:calibration_guard_reference_test]
build_flags =
    ${env:homing_guard_trace_test.build_flags}
    -DCALIBRATION_REFERENCE_TEST

; Isolate reduced-power backoff: restore the previous amplitude before backoff,
; not after. Search current, PWM cap, guards and backoff speed/distance unchanged.
[env:homing_backoff_power_test]
build_flags =
    ${env:calibration_guard_reference_test.build_flags}
    -DHOMING_RESTORE_BEFORE_BACKOFF_TEST

; Normal motion firmware with pauses/logging to isolate post-home transitions.
; Does not home automatically; send G28 only when ready to observe the test.
[env:homing_transition_test]
build_flags =
    ${env.build_flags}
    -DHOMING_TRANSITION_TEST

; Same staged homing test, but leave feedback field updates disabled afterward.
; Motors stay powered at the final field until M18; do not use for normal motion.
[env:homing_open_loop_test]
build_flags =
    ${env:homing_transition_test.build_flags}
    -DHOMING_TEST_SKIP_SERVO_RESTART

; Trace homing/calibration phase disagreement without restarting feedback.
[env:homing_phase_trace_test]
build_flags =
    ${env:homing_open_loop_test.build_flags}
    -DHOMING_PHASE_TRACE

; Compare a fresh calibration with saved references without servo handover.
; M56 without S changes calibration in RAM only; no automatic movement.
[env:calibration_reference_test]
build_flags =
    ${env:homing_phase_trace_test.build_flags}
    -DCALIBRATION_REFERENCE_TEST

; Record the first servo field command, then freeze the field after <=50 ms.
; An encoder-based 2-degree rotor excursion cutoff can end the pulse sooner.
[env:homing_servo_pulse_test]
build_flags =
    ${env:homing_transition_test.build_flags}
    -DHOMING_SERVO_PULSE_TEST

; Same bounded pulse, with held-field preload instead of a zeroed velocity PID.
[env:homing_bumpless_test]
build_flags =
    ${env:homing_servo_pulse_test.build_flags}
    -DHOMING_BUMPLESS_SERVO_RESTART

; Extend only the fixed handover's observation interval; keep excursion cutoff.
[env:homing_bumpless_hold_test]
build_flags =
    ${env:homing_bumpless_test.build_flags}
    -DHOMING_SERVO_PULSE_US=1000000

; Fresh RAM calibration stays open-loop; Home tests a guarded bounded restart.
[env:calibration_bumpless_test]
build_flags =
    ${env:homing_bumpless_hold_test.build_flags}
    -DHOMING_PHASE_TRACE
    -DCALIBRATION_REFERENCE_TEST
    -DHOMING_RESTART_GUARD

; Same guarded handover, observed for up to ten seconds; no automatic movement.
[env:calibration_bumpless_long_hold_test]
build_flags =
    ${env:homing_bumpless_test.build_flags}
    -DHOMING_SERVO_PULSE_US=10000000
    -DHOMING_PHASE_TRACE
    -DCALIBRATION_REFERENCE_TEST
    -DHOMING_RESTART_GUARD

; Test the same bounded handover at normal timing, without diagnostic pauses.
[env:homing_bumpless_immediate_test]
build_flags =
    ${env.build_flags}
    -DHOMING_SERVO_PULSE_TEST
    -DHOMING_BUMPLESS_SERVO_RESTART
    -DHOMING_SERVO_PULSE_US=10000000
    -DHOMING_RESTART_GUARD
    -DCALIBRATION_REFERENCE_TEST

; Standalone encoder wiring diagnostic; motors remain disabled.
[env:encoder_wiggle_test]
build_flags =
    ${env.build_flags}
    -DENCODER_WIGGLE_TEST

; Same motor-disabled encoder checks at the normal robot SPI clock.
; Passing the slower 1 MHz wiring test alone does not validate 8 MHz operation.
[env:encoder_spi8m_test]
build_flags =
    ${env:encoder_wiggle_test.build_flags}
    -DENCODER_DIAGNOSTIC_SPI_HZ=8000000

; Standalone open-loop motor and driver diagnostic; encoders are bypassed.
[env:motor_step_test]
build_flags =
    ${env.build_flags}
    -DMOTOR_STEP_TEST
